---
layout: home
title: Compare Platform Years
description: "Compare VFX Reference Platform versions between different years"
---

<!-- Hero Section -->
<section class="bg-gray-50 dark:bg-gray-800/50 border-b border-gray-200 dark:border-gray-700">
  <div class="container mx-auto px-4 max-w-6xl">
    <div class="py-12 md:py-16">
      <div class="max-w-3xl mx-auto text-center">
        <h1 class="text-4xl md:text-5xl font-bold tracking-tight mb-4">
          Compare Platform Years
        </h1>
        <p class="text-lg text-gray-600 dark:text-gray-300 leading-relaxed">
          Select two calendar years to compare and see what changed between them.
        </p>
      </div>
    </div>
  </div>
</section>

<!-- Comparison Controls & Results -->
<section class="container mx-auto px-4 max-w-6xl py-12">
  <div class="flex flex-col sm:flex-row sm:items-end gap-3 sm:gap-4 mb-8">
    <div class="flex-1 sm:flex-none">
      <label for="year1-select" class="block text-sm font-medium mb-1">First Year</label>
      <select id="year1-select" class="w-full sm:w-auto appearance-none bg-white rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-100 px-4 py-2.5 pr-8 bg-[url('data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2020%2020%22%20fill%3D%22%236b7280%22%3E%3Cpath%20fill-rule%3D%22evenodd%22%20d%3D%22M5.23%207.21a.75.75%200%20011.06.02L10%2011.168l3.71-3.938a.75.75%200%20111.08%201.04l-4.25%204.5a.75.75%200%2001-1.08%200l-4.25-4.5a.75.75%200%2001.02-1.06z%22%20clip-rule%3D%22evenodd%22%2F%3E%3C%2Fsvg%3E')] bg-[length:1.25rem_1.25rem] bg-[right_0.5rem_center] bg-no-repeat transition-colors">
      </select>
    </div>

    <div class="hidden sm:flex items-center">
      <span class="text-2xl text-gray-400 px-4">vs</span>
    </div>

    <div class="flex-1 sm:flex-none">
      <label for="year2-select" class="block text-sm font-medium mb-1">Second Year</label>
      <select id="year2-select" class="w-full sm:w-auto appearance-none bg-white rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-100 px-4 py-2.5 pr-8 bg-[url('data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2020%2020%22%20fill%3D%22%236b7280%22%3E%3Cpath%20fill-rule%3D%22evenodd%22%20d%3D%22M5.23%207.21a.75.75%200%20011.06.02L10%2011.168l3.71-3.938a.75.75%200%20111.08%201.04l-4.25%204.5a.75.75%200%2001-1.08%200l-4.25-4.5a.75.75%200%2001.02-1.06z%22%20clip-rule%3D%22evenodd%22%2F%3E%3C%2Fsvg%3E')] bg-[length:1.25rem_1.25rem] bg-[right_0.5rem_center] bg-no-repeat transition-colors">
      </select>
    </div>
  </div>

  <div id="diff-filters" class="flex flex-wrap gap-2 mb-6 text-sm">
    <button data-filter="unchanged" class="diff-filter active flex items-center gap-2 px-3 py-1.5 rounded-full">
      <span class="w-3.5 h-3.5 rounded-sm bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-600 shrink-0"></span>
      Unchanged
    </button>
    <button data-filter="changed" class="diff-filter active flex items-center gap-2 px-3 py-1.5 rounded-full">
      <span class="w-3.5 h-3.5 rounded-sm bg-amber-50 dark:bg-amber-900/30 border border-amber-200 dark:border-amber-700 shrink-0"></span>
      Changed
    </button>
    <button data-filter="added" class="diff-filter active flex items-center gap-2 px-3 py-1.5 rounded-full">
      <span class="w-3.5 h-3.5 rounded-sm bg-green-100 dark:bg-green-900/30 border border-green-300 dark:border-green-700 shrink-0"></span>
      Added
    </button>
    <button data-filter="removed" class="diff-filter active flex items-center gap-2 px-3 py-1.5 rounded-full">
      <span class="w-3.5 h-3.5 rounded-sm bg-red-100 dark:bg-red-900/30 border border-red-300 dark:border-red-700 shrink-0"></span>
      Removed
    </button>
  </div>

  <div id="comparison-results">
    <!-- Results populated by JavaScript -->
    <noscript>
      <div class="info-box">
        <p class="text-sm text-gray-700 dark:text-gray-200">JavaScript is required to use the comparison tool. Please enable JavaScript in your browser settings.</p>
      </div>
    </noscript>
  </div>
</section>

<script src="{{ '/assets/js/platform-data.js' | relative_url }}"></script>
<script src="{{ '/assets/js/year-comparison.js' | relative_url }}"></script>
